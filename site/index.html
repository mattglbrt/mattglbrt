<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matt Gilbert</title>
<meta name="description" content="Matt Gilbert — miniature painter. Find the work at Hobbinomicon.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖌️</text></svg>">
<style>
  :root { --ink: #1b1712; --paper: #f4ecdc; --rule: #c9b99a; --accent: #7a1f1f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 3rem 1.5rem;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    text-align: center;
  }
  h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4rem); font-weight: normal; letter-spacing: .02em; }
  p.lead { margin: .5rem 0 2.5rem; font-style: italic; font-size: 1.15rem; }
  ul { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 22rem; }
  li + li { margin-top: .85rem; }
  a.link {
    display: block; padding: .95rem 1.25rem;
    border: 1px solid var(--rule); border-radius: 4px;
    background: #fffaf0; color: var(--ink);
    font-size: 1.1rem; text-decoration: none;
    transition: border-color .15s, color .15s;
  }
  a.link span { display: block; font-size: .85rem; color: #6b5f4d; margin-top: .15rem; }
  a.link:hover { border-color: var(--accent); color: var(--accent); }
  a.link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  footer { margin-top: 3rem; font-size: .8rem; color: #6b5f4d; }
</style>
</head>
<body>
  <main>
    <h1>Matt Gilbert</h1>
    <p class="lead">Miniature painter.</p>
    <ul>
      <li><a class="link" href="https://hobbinomicon.com">Hobbinomicon<span>hobbinomicon.com</span></a></li>
      <li><a class="link" href="https://www.youtube.com/@Hobbinomicon">YouTube<span>@Hobbinomicon</span></a></li>
      <li><a class="link" href="https://www.instagram.com/hobbinomicon">Instagram<span>@hobbinomicon</span></a></li>
    </ul>
  </main>
  <footer>All artwork and creative content by Matt Gilbert — no AI-generated art.</footer>
</body>
</html>
